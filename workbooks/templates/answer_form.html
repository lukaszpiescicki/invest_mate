{% extends 'base.html' %}  {# Ensure this extends SB Admin 2's base template #}
{% block content %}

<div class="container-fluid">
    <!-- Page Heading -->
    <h1 class="h3 mb-4 text-gray-800">Create New Answer</h1>

    <div class="card shadow mb-4">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="id_text">Answer Text</label>
                    <input type="text" name="text" id="id_text" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="id_question">Question</label>
                    <select name="question" id="id_question" class="form-control">
                        {% for question in questions %}
                        <option value="{{ question.id }}">{{ question.text }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="id_is_correct">Is Correct?</label>
                    <select name="is_correct" id="id_is_correct" class="form-control">
                        <option value="True">Yes</option>
                        <option value="False" selected>No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="id_author">Author</label>
                    <select name="author" id="id_author" class="form-control">
                        {% for user in users %}
                        <option value="{{ user.id }}">{{ user.username }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Create Answer</button>
                <a href="{% url 'answer_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
