{% extends 'base.html' %}  {# Extends SB Admin 2's base template #}
{% block content %}
    <!-- Page Wrapper -->
    <div id="wrapper">
        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">
            <!-- Main Content -->
            <div id="content">
                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                    <h1 class="h3 mb-4 text-gray-800">Delete Confirmation</h1>

                    <!-- Delete Button -->
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
{#                            <h6 class="m-0 font-weight-bold text-primary">Example Item</h6>#}
                        </div>
                        <div class="card-body">
                            <p>Click the delete button to see the confirmation modal.</p>
                            <button class="btn btn-danger btn-icon-split" data-toggle="modal" data-target="#deleteModal">
                                <span class="icon text-white-50">
                                    <i class="fas fa-trash"></i>
                                </span>
                                <span class="text">Delete Item</span>
                            </button>
                        </div>
                    </div>

                </div>
                <!-- /.container-fluid -->

            </div>
        </div>
    </div>
            <!-- End of Main Content -->

    <!-- Delete Modal-->
    <div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Confirm Delete</h5>
                    <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <div class="modal-body">Are you sure you want to delete this item? This action cannot be undone.</div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-dismiss="modal">Cancel</button>
                    <a class="btn btn-danger" href="#" id="confirmDelete">Delete</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Add handling for the delete confirmation
        $(document).ready(function() {
            $('#confirmDelete').click(function() {
                // Here you would add the actual delete functionality
                alert('Item deleted successfully!');
                $('#deleteModal').modal('hide');
                // You could reload the page or remove the element from the DOM here
            });
        });
    </script>
{% endblock %}
