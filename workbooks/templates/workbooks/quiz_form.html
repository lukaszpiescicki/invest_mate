{% extends 'base.html' %}  {# Ensure this extends SB Admin 2's base template #}
{% block content %}

<div class="container-fluid">
    <h1 class="h3 mb-4 text-gray-800">Create New Quiz</h1>

    <div class="card shadow mb-4">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="id_title">Title</label>
                    <input type="text" name="title" id="id_title" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="id_question">Question</label>
                    <select name="question" id="id_question" class="form-control">
                        {% for question in questions %}
                            <option value="{{ question.id }}">{{ question.text }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="id_category">Category</label>
                    <select name="category" id="id_category" class="form-control">
                        {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.text }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Create Quiz</button>
                <a href="{% url 'quiz-list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
