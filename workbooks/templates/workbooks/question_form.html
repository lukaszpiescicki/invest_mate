{% extends 'base.html' %}
{% block content %}

<div class="container-fluid">
    <h1 class="h3 mb-4 text-gray-800">Create New Question</h1>

    <div class="card shadow mb-4">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="id_text">Question Text</label>
                    <textarea name="text" id="id_text" class="form-control" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="id_category">Category</label>
                    <select name="category" id="id_category" class="form-control">
                        {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.text }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Create Question</button>
                <a href="{% url 'question-list'  %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
