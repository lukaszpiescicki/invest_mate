{% extends 'base.html' %}
{% block content %}

    <div class="container-fluid">
        <h1 class="h3 mb-4 text-gray-800">Workbook Details</h1>

        <div class="card shadow mb-4">
            <div class="card-body">
                <h5><strong>User:</strong> {{ workbook.user.username }}</h5>

                <h5 class="mt-3"><strong>Quizzes:</strong></h5>
                <ul class="list-group mb-3">
                    {% for quiz in workbook.quizzes.all %}
                        <li class="list-group-item">{{ quiz.title }}</li>
                    {% empty %}
                        <li class="list-group-item text-muted">No quizzes assigned</li>
                    {% endfor %}
                </ul>
            </div>
        </div>

    </div>

{% endblock %}
