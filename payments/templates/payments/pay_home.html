{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load static %}

{% block title %}
Payment Homepage
{% endblock title %}

{% block content %}
<!-- Page Wrapper -->
<div id="wrapper">
    <!-- Begin Page Content -->
    <div class="container-fluid">

        <!-- Content Row -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- Payment Card -->
                <div class="card shadow-lg">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-gray-800 text-center">Make a Payment</h6>
                    </div>
                    <div class="card-body">
                        <p class="text-center mb-4">Click the button below to proceed with the payment.</p>
                        <form method="post" class="text-center">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-shopping-cart"></i> Purchase Now
                            </button>
                        </form>
                    </div>
                    <div class="card-footer text-muted text-center">
                        Secure payment powered by Stripe.
                    </div>
                </div>
            </div>
        </div>

    </div>
    <!-- End of Page Content -->
</div>
<!-- End of Wrapper -->
{% endblock content %}
